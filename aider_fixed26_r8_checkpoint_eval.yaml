name: glm47-r8-checkpoint-fixed26-eval

# Receipt-backed evaluation of the final durable checkpoint from successful
# R8 managed job 22 (six optimizer updates).
# The official fixed-26 suite remains evaluation-only and is cloned at its
# pinned revisions on the ephemeral worker.
resources:
  cloud: gcp
  region: us-central1
  instance_type: a3-highgpu-8g
  accelerators: H100:8
  image_id: projects/deeplearning-platform-release/global/images/common-cu129-ubuntu-2204-nvidia-580-v20260804
  network_tier: best
  disk_size: 500
  disk_tier: high
  use_spot: true
  job_recovery:
    strategy: FAILOVER
    max_restarts_on_errors: 0
  autostop:
    idle_minutes: 10
    down: true

envs:
  EVAL_RUN_ID: ""

file_mounts:
  ~/fixed26-eval-code:
    source: gs://lifeandhalf-24122025-w8-biayn/transports/aider-fixed26-r19-iter0-20260814
    mode: COPY

  ~/fixed26-workspace/models/GLM-4.7-Flash:
    source: gs://lifeandhalf-24122025-w8-biayn/glm47-public-pr-eval/assets/model/GLM-4.7-Flash
    mode: COPY

  ~/fixed26-workspace/checkpoints/iter_0000005/adapter:
    source: gs://lifeandhalf-24122025-w8-biayn/runs/glm47/experiments/unadmitted-r8-hybrid45-exact40-r87/unadmitted-r8-r87-run21-20260814T030808Z-attempt-20260814T031719Z-d951d40e/checkpoints/grpo_lora_r16/iter_0000005/adapter
    mode: COPY

setup: |
  set -euo pipefail
  export EXPECTED_GPU_COUNT=8
  export EXPECTED_GPU_MODEL=H100
  export EXPECTED_GPU_MEMORY_MIB=80000
  bash ~/fixed26-eval-code/gcp_h100_host_setup.sh

  sudo apt-get update
  sudo apt-get install -y --no-install-recommends \
    build-essential cmake git make python3-venv

  # The checked-in evaluator invokes Docker directly. Grant the ephemeral
  # worker user access to the local daemon for both SGLang and Aider tests.
  sudo chmod 0666 /var/run/docker.sock

  sudo mkdir -p /workspace
  if ! mountpoint -q /workspace; then
    sudo mount --bind "${HOME}/fixed26-workspace" /workspace
  fi

  export EVAL_ROOT=/workspace/eval-job22-iter5
  mkdir -p "${EVAL_ROOT}"
  if [[ ! -d "${EVAL_ROOT}/aider/.git" ]]; then
    git clone https://github.com/Aider-AI/aider.git "${EVAL_ROOT}/aider"
  fi
  git -C "${EVAL_ROOT}/aider" checkout --detach \
    5dc9490bb35f9729ef2c95d00a19ccd30c26339c

  # Pinned benchmark.py invokes the C++ wrapper through its canonical
  # in-container path. This SkyPilot evaluator runs benchmark.py on the
  # ephemeral host, so bind that canonical path to the exact pinned checkout.
  if [[ -e /aider || -L /aider ]]; then
    test "$(readlink -f /aider)" = "$(readlink -f "${EVAL_ROOT}/aider")"
  else
    sudo ln -s "${EVAL_ROOT}/aider" /aider
  fi
  test -x /aider/benchmark/cpp-test.sh

  mkdir -p "${EVAL_ROOT}/aider/tmp.benchmarks"
  if [[ ! -d "${EVAL_ROOT}/aider/tmp.benchmarks/polyglot-benchmark/.git" ]]; then
    git clone https://github.com/Aider-AI/polyglot-benchmark.git \
      "${EVAL_ROOT}/aider/tmp.benchmarks/polyglot-benchmark"
  fi
  git -C "${EVAL_ROOT}/aider/tmp.benchmarks/polyglot-benchmark" checkout --detach \
    7e0611e77b54e2dea774cdc0aa00cf9f7ed6144f

  if [[ ! -x "${EVAL_ROOT}/aider-venv/bin/python" ]]; then
    python3 -m venv "${EVAL_ROOT}/aider-venv"
  fi
  "${EVAL_ROOT}/aider-venv/bin/pip" install --upgrade pip
  # Install Aider itself, then only the modules imported by benchmark.py and
  # benchmark/plots.py.  The full pinned [dev] lock now includes
  # contourpy==1.3.3 (Python >=3.11), while this worker image uses Python
  # 3.10; job 26 therefore failed in setup before any benchmark task.  These
  # direct benchmark dependencies let pip choose Python-3.10-compatible
  # transitive wheels (notably contourpy 1.3.2).
  "${EVAL_ROOT}/aider-venv/bin/pip" install -e "${EVAL_ROOT}/aider"
  "${EVAL_ROOT}/aider-venv/bin/pip" install \
    "lox==1.0.0" \
    "pandas==2.3.3" \
    "matplotlib==3.10.8" \
    "imgcat==0.6.0"
  "${EVAL_ROOT}/aider-venv/bin/python" -c \
    "import lox, pandas, matplotlib, imgcat"

  gcloud auth print-access-token | \
    docker login --username oauth2accesstoken --password-stdin \
      https://us-central1-docker.pkg.dev >/dev/null
  docker pull \
    us-central1-docker.pkg.dev/lifeandhalf-24122025/w8-biayn/glm47-full-v5-unadmitted-grpo@sha256:5df1c41efb6062a292ac68a49d68ad955d9f8209c182d3fc2f7e8c634ca076a2

run: |
  set -euo pipefail
  test -n "${EVAL_RUN_ID}"

  export GLM47_EVAL_ROOT=/workspace/eval-job22-iter5
  export GLM47_EVAL_MODEL_PATH=/workspace/models/GLM-4.7-Flash
  export GLM47_EVAL_TRAIN_RUN_ID=unadmitted-r8-r87-run21-20260814T030808Z-attempt-20260814T031719Z-d951d40e
  export GLM47_EVAL_ADAPTER_PATH=/workspace/checkpoints/iter_0000005/adapter
  export GLM47_EVAL_ADAPTER_SHA256=7fb350de045fb1d476fefcdaeb59a5c69ea7f5e2fe744516b63e146f26d8bfc2
  export GLM47_EVAL_DATA_MANIFEST_SHA256=72296f7bae1b4690a613922f3f29b2011e4a8646d356a4e7663cfc5822e7bfd2
  export GLM47_EVAL_RUN_ID="${EVAL_RUN_ID}"
  export GLM47_EVAL_POD_NAME="${SKYPILOT_TASK_ID:-gcp-skypilot}"
  export GLM47_EVAL_CONTAINER_NAMES="${EVAL_RUN_ID}-shard0,${EVAL_RUN_ID}-shard1"
  export GLM47_EVAL_IMAGE=us-central1-docker.pkg.dev/lifeandhalf-24122025/w8-biayn/glm47-full-v5-unadmitted-grpo@sha256:5df1c41efb6062a292ac68a49d68ad955d9f8209c182d3fc2f7e8c634ca076a2

  result_dir="${GLM47_EVAL_ROOT}/results/${EVAL_RUN_ID}"
  destination="gs://lifeandhalf-24122025-w8-biayn/runs/glm47/evaluations/aider-fixed26/${EVAL_RUN_ID}"

  sync_evidence() {
    if [[ -d "${result_dir}" ]]; then
      gcloud storage rsync --recursive --checksums-only \
        "${result_dir}" "${destination}"
    fi
    for shard in 0 1; do
      for output_dir in \
        "${GLM47_EVAL_ROOT}"/aider/tmp.benchmarks/*--"${EVAL_RUN_ID}"-shard-"${shard}"; do
        if [[ -d "${output_dir}" ]]; then
          gcloud storage rsync --recursive --checksums-only \
            "${output_dir}" "${destination}/benchmark-output-shard-${shard}"
        fi
      done
    done
  }
  trap sync_evidence EXIT

  python3 ~/fixed26-eval-code/aider_fixed26_eval.py
  test -f "${result_dir}/run_receipt.json"
  sync_evidence
