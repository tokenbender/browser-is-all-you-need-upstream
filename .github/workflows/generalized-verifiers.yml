name: generalized-cpp-verifiers

on:
  pull_request:
    paths:
      - "Reward_GRPO/Generalized Cpp Verifiers/**"
      - "Reward_GRPO/global_cpp_verifier_runner.py"
      - "generalized_verifier_docs/**"
      - "tests/test_generalized_cpp_verifiers.py"
      - ".github/workflows/generalized-verifiers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermetic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile verifier sources
        run: >-
          python -m compileall -q
          Reward_GRPO/global_cpp_verifier_runner.py
          "Reward_GRPO/Generalized Cpp Verifiers/verifiers"
          generalized_verifier_docs
      - name: Run hermetic integration tests
        run: python -m pytest -q tests/test_generalized_cpp_verifiers.py
