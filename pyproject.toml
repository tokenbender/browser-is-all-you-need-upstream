[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glm47-h100-posttraining"
version = "0.1.0"
description = "GLM-4.7-Flash SFT and GRPO on 8x NVIDIA H100 with Miles."
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.34",
    "pydantic>=2.7",
    "wandb>=0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4.18",
    # Existing training-gate verifier tests exercise real CPU tensors.
    "torch>=2.4",
    "ruff>=0.6",
]

[tool.hatch.build]
exclude = [
    "/.*",
    "/wandb",
]

[tool.hatch.build.targets.wheel]
packages = ["src/glm47_posttraining"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
addopts = "-p test_generalized_cpp_grpo"
markers = ["staged_assets: integration checks requiring an explicitly supplied production task registry"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
